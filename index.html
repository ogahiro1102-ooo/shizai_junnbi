<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出庫確認・準備アプリ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>出庫確認・準備</h1>
    </header>

    <main>

        <!-- ==========================
             検索エリア
        =========================== -->

        <section class="filter-area">

            <div class="filter-item">
                <label for="targetDate">出庫希望日</label>
                <input type="date" id="targetDate">
            </div>

            <div class="filter-item">
                <label for="keyword">業者名・出庫者名</label>
                <input
                    type="text"
                    id="keyword"
                    placeholder="業者名または出庫者名で検索">
            </div>

            <button id="searchButton">
                表示
            </button>

        </section>


        <!-- ==========================
             ローディング
        =========================== -->

        <div id="loading" class="loading hidden">
            読み込み中...
        </div>


        <!-- ==========================
             案件一覧
        =========================== -->

        <section id="requestList"></section>


        <!-- ==========================
             データなし
        =========================== -->

        <div id="emptyMessage" class="empty-message hidden">
            対象の案件はありません。
        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
